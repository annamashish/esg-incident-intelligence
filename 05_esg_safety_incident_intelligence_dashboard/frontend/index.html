<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESG / Safety Incident Intelligence Dashboard Demo</title>
<style>body{font-family:Arial,sans-serif;margin:32px;background:#f7fafc}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;max-width:850px}button{background:#12372a;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}pre{background:#0f172a;color:#e5e7eb;padding:16px;border-radius:10px;overflow:auto}</style></head>
<body><div class="card"><h1>ESG / Safety Incident Intelligence Dashboard</h1><p>This is a lightweight frontend starter. Connect it to the FastAPI endpoints in <code>/backend/app.py</code>.</p><button onclick="runDemo()">Run sample API call</button><pre id="out">Click the button to test.</pre></div>
<script>
async function runDemo(){
  try{ const r=await fetch('/api/demo'); const j=await r.json(); document.getElementById('out').textContent=JSON.stringify(j,null,2); }
  catch(e){ document.getElementById('out').textContent='Backend not connected yet. Run FastAPI and serve frontend or deploy together.'; }
}
</script></body></html>
